<svg viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="16" markerHeight="16" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L13,6 L1,11 Z" fill="white" stroke="#0f766e" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Use Case dijagram — Travel Planner</text>

  <!-- System boundary -->
  <rect x="380" y="60" width="480" height="980" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">Sistem za planiranje putovanja</text>

  <!-- Association lines: Gost -->
  <g stroke="#64748b" stroke-width="1.3">
    <line x1="168" y1="180" x2="480" y2="110"/>
    <line x1="168" y1="180" x2="480" y2="168"/>
    <line x1="168" y1="180" x2="480" y2="226"/>
  </g>

  <!-- Association lines: Korisnik -->
  <g stroke="#0f766e" stroke-width="1.3">
    <line x1="168" y1="560" x2="480" y2="168"/>
    <line x1="168" y1="560" x2="480" y2="284"/>
    <line x1="168" y1="560" x2="480" y2="342"/>
    <line x1="168" y1="560" x2="480" y2="400"/>
    <line x1="168" y1="560" x2="480" y2="458"/>
    <line x1="168" y1="560" x2="480" y2="516"/>
    <line x1="168" y1="560" x2="480" y2="574"/>
    <line x1="168" y1="560" x2="480" y2="632"/>
    <line x1="168" y1="560" x2="480" y2="690"/>
    <line x1="168" y1="560" x2="480" y2="748"/>
    <line x1="168" y1="560" x2="480" y2="806"/>
  </g>

  <!-- Association lines: Admin (own use cases only, rest nasledjeno preko generalizacije) -->
  <g stroke="#b45309" stroke-width="1.3">
    <line x1="168" y1="940" x2="480" y2="864"/>
    <line x1="168" y1="940" x2="480" y2="922"/>
    <line x1="168" y1="940" x2="480" y2="980"/>
  </g>

  <!-- Generalizacija: Admin nasledjuje sve Korisnikove use case-ove -->
  <line x1="104" y1="900" x2="104" y2="614" stroke="#0f766e" stroke-width="1.8" marker-end="url(#tri)"/>
  <text x="90" y="757" font-size="11" fill="#0f766e" transform="rotate(-90 90 757)" text-anchor="middle">generalizacija</text>

  <!-- Actor: Gost -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <circle cx="140" cy="140" r="16" fill="#fff"/>
    <line x1="140" y1="156" x2="140" y2="200"/>
    <line x1="114" y1="172" x2="166" y2="172"/>
    <line x1="140" y1="200" x2="120" y2="234"/>
    <line x1="140" y1="200" x2="160" y2="234"/>
  </g>
  <text x="140" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Gost</text>

  <!-- Actor: Korisnik -->
  <g stroke="#0f766e" stroke-width="2" fill="none">
    <circle cx="140" cy="520" r="16" fill="#fff"/>
    <line x1="140" y1="536" x2="140" y2="580"/>
    <line x1="114" y1="552" x2="166" y2="552"/>
    <line x1="140" y1="580" x2="120" y2="614"/>
    <line x1="140" y1="580" x2="160" y2="614"/>
  </g>
  <text x="140" y="636" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">Korisnik</text>

  <!-- Actor: Admin -->
  <g stroke="#b45309" stroke-width="2" fill="none">
    <circle cx="140" cy="900" r="16" fill="#fff"/>
    <line x1="140" y1="916" x2="140" y2="960"/>
    <line x1="114" y1="932" x2="166" y2="932"/>
    <line x1="140" y1="960" x2="120" y2="994"/>
    <line x1="140" y1="960" x2="160" y2="994"/>
  </g>
  <text x="140" y="1016" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">Admin</text>

  <!-- Gost use cases -->
  <g font-size="13" fill="#334155" text-anchor="middle">
    <g>
      <ellipse cx="650" cy="110" rx="170" ry="24" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
      <text x="650" y="115">Registracija</text>
    </g>
    <g>
      <ellipse cx="650" cy="168" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="173" fill="#0f172a">Prijava (login)</text>
    </g>
    <g>
      <ellipse cx="650" cy="226" rx="170" ry="24" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
      <text x="650" y="231">Pregled deljenog plana bez prijave (VIEW)</text>
    </g>
  </g>

  <!-- Korisnik use cases -->
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <g>
      <ellipse cx="650" cy="284" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="289">Kreiranje / izmena / brisanje plana</text>
    </g>
    <g>
      <ellipse cx="650" cy="342" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="347">Upravljanje destinacijama</text>
    </g>
    <g>
      <ellipse cx="650" cy="400" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="405">Upravljanje aktivnostima (lista i kalendar)</text>
    </g>
    <g>
      <ellipse cx="650" cy="458" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="463">Evidencija troškova i budžeta</text>
    </g>
    <g>
      <ellipse cx="650" cy="516" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="521">Checklist / packing lista</text>
    </g>
    <g>
      <ellipse cx="650" cy="574" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="579">Beleške</text>
    </g>
    <g>
      <ellipse cx="650" cy="632" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="637">Podsetnici</text>
    </g>
    <g>
      <ellipse cx="650" cy="690" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="695">Deljenje plana (kod / QR, VIEW / EDIT)</text>
    </g>
    <g>
      <ellipse cx="650" cy="748" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="753">Izvoz plana u PDF</text>
    </g>
    <g>
      <ellipse cx="650" cy="806" rx="170" ry="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
      <text x="650" y="811">Pristup tuđem planu kroz EDIT deljenje</text>
    </g>
  </g>

  <!-- Admin-only use cases -->
  <g font-size="13" fill="#7c2d12" text-anchor="middle">
    <g>
      <ellipse cx="650" cy="864" rx="170" ry="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
      <text x="650" y="869">Pregled svih korisnika</text>
    </g>
    <g>
      <ellipse cx="650" cy="922" rx="170" ry="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
      <text x="650" y="927">Brisanje korisničkog naloga</text>
    </g>
    <g>
      <ellipse cx="650" cy="980" rx="170" ry="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
      <text x="650" y="985">Administracija svih planova u sistemu</text>
    </g>
  </g>
</svg>
