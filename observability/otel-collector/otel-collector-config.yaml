# OpenTelemetry Collector - centralna prijemna tačka za sva 4 backend servisa (Gateway, AuthService,
# TripService, SharingService). Servisi šalju OTLP na localhost:4317 (host je publikovan iz kontejnera
# ispod), Collector rutira dalje: traces -> Tempo, metrics -> Prometheus (scrape), logs -> Loki.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Prometheus ne prima push - Collector izlaže /metrics na 8889, Prometheus ga scrape-uje (vidi
  # prometheus/prometheus.yml).
  prometheus:
    endpoint: 0.0.0.0:8889

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, debug]
