# Prometheus scrape-uje metrike sa OTel Collector-a (koji ih je primio preko OTLP od backend servisa
# i izložio na 8889 kroz prometheus exporter), umesto da svaki servis scrape-uje pojedinačno.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
